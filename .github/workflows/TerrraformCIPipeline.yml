name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.14.6"

jobs:
  # =========================
  # CI: Terraform Validation
  # =========================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform Format Check
      - name: Terraform Format Check
        working-directory: ./environmnet/preprod
        run: terraform fmt -check -recursive

      # Terraform Init
      - name: Terraform Init
        working-directory: ./environmnet/preprod
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ./environmnet/preprod
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ./environmnet/preprod
        run: terraform plan -out=tfplan

      # Security Scan
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./environmnet/preprod
          framework: terraform
          soft_fail: true